<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | AEGEE-Enschede Lustrum VIII</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="signup-page">
    <div class="scanlines" aria-hidden="true"></div>
    <main class="signup-shell">
      <a class="back-link" href="index.html">Back to Lustrum VIII</a>
      <section class="signup-card" aria-labelledby="signup-title">
        <p class="kicker">Actual signup page</p>
        <h1 id="signup-title">You clicked. Bold move.</h1>
        <p>
          This placeholder can be replaced with the final registration form or
          external ticket link. For now it confirms that every activity button
          leads somewhere real.
        </p>
        <form>
          <label>
            Name
            <input type="text" name="name" placeholder="Your name">
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="name@example.com">
          </label>
          <label>
            Activity
            <select name="activity" id="activity-select">
              <option>Opening Night</option>
              <option>Clickbait City Game</option>
              <option>Scandalous Dinner</option>
              <option>Final Boss Party</option>
              <option>Full Lustrum Pass</option>
            </select>
          </label>
          <button class="button primary" type="button">Submit placeholder</button>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
